<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Navtera Admin Girişi</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #0B1325; font-family: 'Montserrat', Arial, sans-serif; color: #F7F6F2; padding: 16px;
        }
        .card {
            width: 100%; max-width: 360px; background: #0e1830; border: 1px solid #A87C2A;
            border-radius: 16px; padding: 32px 28px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        h1 { margin: 0; color: #F5D77F; font-family: 'Cinzel', serif; letter-spacing: 2px; font-size: 22px; text-align: center; }
        .sub { text-align: center; color: #cfcfcf; font-size: 13px; margin: 6px 0 24px; }
        label { display: block; font-size: 12px; color: #cfcfcf; margin-bottom: 6px; }
        input {
            width: 100%; padding: 11px 14px; margin-bottom: 16px; border-radius: 10px;
            background: #14213D; border: 1px solid rgba(168,124,42,0.4); color: #F7F6F2; font-size: 14px; outline: none;
        }
        input:focus { border-color: #F5D77F; }
        button {
            width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer;
            background: #A87C2A; color: #0B1325; font-weight: 700; font-size: 14px;
        }
        button:hover { background: #F5D77F; }
        .error {
            background: rgba(200,60,60,0.15); border: 1px solid rgba(200,60,60,0.5); color: #ffb3b3;
            padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <form class="card" method="POST" action="{{ url_for('admin.login') }}">
        <h1>NAVTERA</h1>
        <div class="sub">Admin Paneli Girişi</div>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <label for="username">Kullanıcı adı</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Şifre</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Giriş Yap</button>
    </form>
</body>
</html>
